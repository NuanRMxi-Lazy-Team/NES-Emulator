name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
            binary_ext: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            binary_ext: ".exe"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
            binary_ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux cross-compiler for arm64
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Get package name and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(cargo metadata --no-deps --format-version 1 | python -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          NAME=$(cargo metadata --no-deps --format-version 1 | python -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['name'])")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          NAME="${{ steps.meta.outputs.name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          TARGET="${{ matrix.target }}"
          EXT="${{ matrix.binary_ext }}"
          SRC="target/${TARGET}/release/${NAME}${EXT}"
          OUT="dist/${NAME}-${VERSION}-${{ matrix.artifact }}${EXT}"

          mkdir -p dist
          cp "$SRC" "$OUT"

          echo "Artifact created: $OUT"
          ls -l dist

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
